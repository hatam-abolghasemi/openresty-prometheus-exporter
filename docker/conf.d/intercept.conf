# https interception: baked machinery for the outbound proxy. Loaded from every
# nginx.conf that keeps `include /etc/nginx/conf.d/*.conf;`. Generic and
# app-agnostic -- nothing here is per-app, so it lives in the image, not in a
# mounted default.conf.
#
# Inert until switched on: a deployment enables interception by setting
# INTERCEPT_TLS=on (see /etc/nginx/main.d/intercept-env.conf) and mounting a CA
# keypair at /etc/nginx/intercept/ca.crt + ca.key. Until then lib/intercept.lua
# routes every CONNECT straight through and this :3129 server gets no traffic.
#
# The outbound server itself stays in default.conf; it only needs its
# CONNECT handling to read the tunnel target from lib/intercept.lua:
#
#     set_by_lua_block $connect_upstream { return require("intercept").upstream() }
#     if ($request_method = CONNECT) { tunnel_pass $connect_upstream; }

lua_shared_dict ssl_mint_cache 10m;

# Re-origination pool: decrypted requests go to their real destination over
# kept-alive TLS connections, pooled per hostname (lib/intercept_origin.lua).
#
# `keepalive 0` is required, not cosmetic: nginx >= 1.29 gives every upstream{}
# block an implicit `keepalive 32` pool keyed by IP:port only. Left on, it hands
# a connection verified for one host to another host on the same IP, skipping
# the TLS name check. The per-host pool is `balancer_keepalive` + the
# enable_keepalive() call in lib/intercept_origin.lua.
upstream intercept_origin {
    server 0.0.0.1;
    balancer_by_lua_block { require("intercept_origin").balance() }
    keepalive 0;
    balancer_keepalive 256;
}

server {
    listen  127.0.0.1:3129 ssl;
    set     $request_mode 1;

    ssl_certificate      /etc/nginx/intercept/fallback.crt;
    ssl_certificate_key  /etc/nginx/intercept/fallback.key;
    ssl_certificate_by_lua_block { require("tls_intercept").mint() }
    ssl_protocols        TLSv1.2 TLSv1.3;

    access_by_lua_block {
        require("http_metrics").classify_source()
        require("intercept_origin").resolve()
    }
    log_by_lua_block    { require("http_metrics").record() }

    proxy_ssl_server_name          on;
    proxy_ssl_name                 $host;
    proxy_ssl_verify               on;
    proxy_ssl_verify_depth         3;
    proxy_ssl_trusted_certificate  /etc/nginx/intercept/trusted-ca.crt;

    location / {
        proxy_pass               https://intercept_origin$request_uri;
        proxy_http_version       1.1;
        proxy_set_header         Host       $http_host;
        proxy_set_header         Connection "";
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_connect_timeout    10s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}