# Main config baked into the image at /etc/nginx/nginx.conf. The flavor's
# stock config path (e.g. /usr/local/openresty/nginx/conf/nginx.conf) is a
# symlink to it, so the base image's CMD and a bare `nginx -t` both use it.
#
# Overridable without rebuilding:
#   /etc/nginx/nginx.conf          replace this file entirely
#   /etc/nginx/conf.d/*.conf       http{} level: default.conf (inbound +
#                                  outbound); intercept.conf is linked in
#                                  here at start when INTERCEPT_TLS=on
#   /etc/nginx/main.d/*.conf       main level: drop a `stream { ... }` here to
#                                  enable the stream feature (off by default)
#   METRICS_CONFIG env var         override simple metrics_config.lua values,
#                                  declared in main.d/metrics-config-env.conf
#
# APP_PORT (default 8080) is the port of the app container that the :80
# inbound leg forwards to; it must be listed with `env` to be readable
# from Lua.

worker_processes      1;
worker_rlimit_nofile  8192;
error_log             /dev/stderr warn;

env APP_PORT;

include /etc/nginx/main.d/*.conf;

events {
    # Preallocated per worker (~0.45 KB each). A sidecar in front of one app
    # rarely needs more; raise it for high-traffic services (each proxied
    # request uses two slots). nginx_connection_slots_limit exports it.
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Off: the metrics already cover every request, and per-request log lines
    # cost a write per request plus log-pipeline storage. To get them back for
    # one server, put this inside its server {} block (a mounted default.conf):
    #   access_log /dev/stdout combined buffer=64k flush=1s;
    access_log    off;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;

    keepalive_timeout   75s;
    keepalive_requests  10000;

    include /etc/nginx/conf.d/*.conf;
}
