# Interception for the outbound proxy: the :3129 TLS terminator and the :3130
# h2c (plaintext gRPC) terminator. lib/connect_tunnel.lua hands each CONNECT to
# one of them by its first bytes (TLS on any port -> :3129, HTTP/2 preface ->
# :3130); anything else is tunnelled unchanged.
#
# Loaded only when the container starts with INTERCEPT_TLS=on. The image's
# entrypoint (docker/entrypoint.sh) then links this file into
# /etc/nginx/conf.d/, so it is picked up by every nginx.conf that keeps
# `include /etc/nginx/conf.d/*.conf;`. With interception off (the default)
# nothing here exists in the running nginx: no :3129 listener, no OpenSSL
# context, no system CA bundle in memory, no ssl_mint_cache.
#
# Decided once, at container start. Changing INTERCEPT_TLS needs a container
# restart; a reload does not re-run the entrypoint.
#
# A deployment enables interception by setting INTERCEPT_TLS=on (see
# /etc/nginx/main.d/intercept-env.conf) and mounting a CA keypair at
# /etc/nginx/intercept/ca.crt + ca.key.
#
# The outbound server itself stays in default.conf; its CONNECT handling picks
# native tunnel_pass or the detecting tunnel via lib/intercept.lua:
#
#     set_by_lua_block $connect_mode     { return require("intercept").connect_mode() }
#     set_by_lua_block $connect_upstream { return require("intercept").upstream() }
#     if ($connect_mode = detect) { content_by_lua_block { require("connect_tunnel").run() } }
#     if ($connect_mode = tunnel) { tunnel_pass $connect_upstream; }

lua_shared_dict ssl_mint_cache 10m;

# Re-origination pool: decrypted requests go to their real destination over
# kept-alive TLS connections, pooled per hostname (lib/intercept_origin.lua).
#
# `keepalive 0` is required, not cosmetic: nginx >= 1.29 gives every upstream{}
# block an implicit `keepalive 32` pool keyed by IP:port only. Left on, it hands
# a connection verified for one host to another host on the same IP, skipping
# the TLS name check. The per-host pool is `balancer_keepalive` + the
# enable_keepalive() call in lib/intercept_origin.lua.
upstream intercept_origin {
    server 0.0.0.1;
    balancer_by_lua_block { require("intercept_origin").balance() }
    keepalive 0;
    balancer_keepalive 256;
}

# gRPC calls are HTTP/2 to the destination, so they get their own pools: a
# pooled HTTP/1.1 connection must never be handed to grpc_pass, or the reverse.
upstream intercept_origin_grpc {
    server 0.0.0.1;
    balancer_by_lua_block { require("intercept_origin").balance() }
    keepalive 0;
    balancer_keepalive 256;
}

upstream intercept_origin_h2c {
    server 0.0.0.1;
    balancer_by_lua_block { require("intercept_origin").balance() }
    keepalive 0;
    balancer_keepalive 256;
}

server {
    listen  127.0.0.1:3129 ssl;
    # Negotiates h2 or http/1.1 by ALPN, as the client offers: gRPC over TLS
    # (h2 only) is decrypted too. Destinations are reached over HTTP/1.1
    # (proxy_pass) or, for gRPC, HTTP/2 (grpc_pass).
    http2   on;
    set     $request_mode 1;

    ssl_certificate      /etc/nginx/intercept/fallback.crt;
    ssl_certificate_key  /etc/nginx/intercept/fallback.key;
    ssl_certificate_by_lua_block { require("tls_intercept").mint() }
    ssl_protocols        TLSv1.2 TLSv1.3;

    access_by_lua_block {
        require("http_metrics").classify_source()
        require("intercept_origin").resolve()
    }
    log_by_lua_block    { require("http_metrics").record() }

    proxy_ssl_server_name          on;
    proxy_ssl_name                 $host;
    proxy_ssl_verify               on;
    proxy_ssl_verify_depth         3;
    proxy_ssl_trusted_certificate  /etc/nginx/intercept/trusted-ca.crt;

    grpc_ssl_server_name           on;
    grpc_ssl_name                  $host;
    grpc_ssl_verify                on;
    grpc_ssl_verify_depth          3;
    grpc_ssl_trusted_certificate   /etc/nginx/intercept/trusted-ca.crt;

    # gRPC messages and streams have no size bound of their own.
    client_max_body_size  0;

    location / {
        # gRPC over TLS (application/grpc, not gRPC-Web): forwarded as HTTP/2
        # to the destination, its result recorded from grpc-status.
        if ($content_type ~* "^application/grpc($|[+;\s])") {
            grpc_pass  grpcs://intercept_origin_grpc;
        }
        grpc_set_header          Host       $http_host;
        grpc_connect_timeout     10s;
        grpc_send_timeout        300s;
        grpc_read_timeout        300s;

        proxy_pass               https://intercept_origin$request_uri;
        proxy_http_version       1.1;
        proxy_set_header         Host       $http_host;
        proxy_set_header         Connection "";
        proxy_pass_header        Server;
        proxy_pass_header        Date;
        proxy_buffering          off;
        proxy_request_buffering  off;
        proxy_connect_timeout    10s;
        proxy_send_timeout       300s;
        proxy_read_timeout       300s;
    }
}

# Plaintext gRPC: what a gRPC client speaks once its CONNECT tunnel is up to a
# server without TLS -- HTTP/2 with prior knowledge. Decoded, recorded (route
# /package.Service/Method, status grpc_<code>), forwarded unchanged.
server {
    listen  127.0.0.1:3130;
    http2   on;
    set     $request_mode 1;

    client_max_body_size  0;

    access_by_lua_block {
        require("http_metrics").classify_source()
        require("intercept_origin").resolve(80)
    }
    log_by_lua_block    { require("http_metrics").record() }

    location / {
        grpc_pass              grpc://intercept_origin_h2c;
        grpc_set_header        Host $http_host;
        grpc_connect_timeout   10s;
        grpc_send_timeout      300s;
        grpc_read_timeout      300s;
    }
}
