# stream feature: L4 (TCP/UDP) metrics for the app's dependencies. Mounted at
# /etc/nginx/stream.d/stream.conf; stream-enable.conf (mounted into
# /etc/nginx/main.d/) is what opens the `stream { }` block that includes it.
#
# All logic lives in lib/stream_metrics.lua and every knob in
# lib/metrics_config.lua (the `stream` and `apps.stream` tables); this file is
# only wiring plus one server{} per destination.
#
# nginx cannot share a shared dict between its http and stream modules, so
# the stream feature keeps its own registry and its own scrape port (:9254),
# separate from the HTTP metrics on :9145.

lua_shared_dict stream_metrics        3M;
lua_shared_dict stream_custom_metrics 1M;
lua_package_path "/opt/prometheus/?.lua;/opt/prometheus/lib/?.lua;;";

init_worker_by_lua_block { require("stream_metrics").init() }

# One server{} per destination. The app connects to the local listen address
# instead of the dependency. $destination_name feeds the `destination` label
# and the apps.stream.<name> switch in metrics_config.lua.
#
# Keep both Lua hooks inside each destination server{}: preread is the +1 of
# nginx_stream_connections_active (record() is the -1), and a log hook at the
# top of this file would also fire for the exposition server below.
server {
    listen    127.0.0.1:16379;
    set       $destination_name "redis";

    preread_by_lua_block { require("stream_metrics").connection_open() }
    log_by_lua_block     { require("stream_metrics").record() }

    proxy_pass  redis-master.example-namespace.svc.cluster.local:6379;
}

# Exposition: answers Prometheus' GET /metrics on its own port. Carries no app
# traffic and records nothing.
server {
    listen  9254;
    content_by_lua_block { require("stream_metrics").collect() }
}
