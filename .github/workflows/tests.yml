name: Run Tests
on:
  push:
    paths:
      - lib/**
      - tests/**
      - vendor/**
      - .github/workflows/tests.yml
  pull_request:
    paths:
      - lib/**
      - tests/**
      - vendor/**
      - .github/workflows/tests.yml
  workflow_dispatch:

jobs:
  lib:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y --no-install-recommends luajit
      - run: luajit tests/lib_test.lua

  # upstream's own suite, run against the vendored copy to prove it is intact
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vendor/nginx-lua-prometheus
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: sudo apt-get install -y libpcre2-dev libreadline-dev
      - run: pip install hererocks
      - run: hererocks "$RUNNER_TEMP/lua" -r^ --lua 5.1
      - run: echo "$RUNNER_TEMP/lua/bin" >> "$GITHUB_PATH"
      - run: luarocks install luacheck && luarocks install luaunit && luarocks install lrexlib-pcre2
      - run: luacheck --globals ngx -- prometheus.lua prometheus_keys.lua prometheus_resty_counter.lua
      - run: luacheck --globals luaunit rex_pcre2 ngx TestPrometheus TestKeyIndex -- prometheus_test.lua
      - run: lua prometheus_test.lua

  vendor-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vendor/nginx-lua-prometheus/integration
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/nginx-lua-prometheus/integration/go.mod
      - run: go get
      - run: chmod +x test.sh && ./test.sh
