name: Retry

# Re-runs the failed jobs of a failed run, up to 2 times (3 attempts in all).
# A run can't re-run itself while it is still in progress, so this lives in
# its own workflow and fires once the watched run has completed.
on:
  workflow_run:
    workflows: [OpenResty image]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          echo "run $RUN_ID failed on attempt $ATTEMPT; re-running its failed jobs"
          gh run rerun "$RUN_ID" --failed
