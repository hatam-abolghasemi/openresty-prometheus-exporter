name: OpenResty image

# Mirrors docker-openresty: for every flavor upstream publishes for a release
# (alpine, bookworm, noble, rocky, ...), build that flavor with this repo baked
# in, on the same platforms, under the same tags -- only the image name differs.
#
#   openresty/openresty:<release>-<flavor>
#   ghcr.io/<owner>/openresty-prometheus-exporter:<release>-<flavor>
#
# Flavors and platforms are read from Docker Hub for each release, so a flavor
# upstream adds or drops shows up here without editing this file. The catalog
# job keeps docs/images.md in step with what is in the registry. Failed runs
# are retried by retry.yml.

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - vendor/**
      - lib/**
      - docker/**
      - .dockerignore
      - .github/workflows/openresty-image.yml
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: docker-openresty release, e.g. 1.31.1.1-4 (empty = newest)
        required: false
        default: ""
      flavors:
        description: comma-separated flavors, e.g. alpine,bookworm (empty = all)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: openresty-image
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/openresty/docker-openresty.git
  BASE_IMAGE: openresty/openresty
  # the flavor :latest points at (upstream's own :latest is bookworm)
  LATEST_FLAVOR: alpine

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      upstream_tag: ${{ steps.resolve.outputs.upstream_tag }}
      resty_version: ${{ steps.resolve.outputs.resty_version }}
      series: ${{ steps.resolve.outputs.series }}
      is_latest: ${{ steps.resolve.outputs.is_latest }}
      is_newest_revision: ${{ steps.resolve.outputs.is_newest_revision }}
      is_newest_in_series: ${{ steps.resolve.outputs.is_newest_in_series }}
      matrix: ${{ steps.flavors.outputs.matrix }}
      candidates: ${{ steps.flavors.outputs.candidates }}
    steps:
      - id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          all_tags=$(git ls-remote --tags --refs "$UPSTREAM_REPO" \
            | awk -F/ '{print $3}' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$' \
            | sort -V)
          newest_with_prefix() { printf '%s\n' "$all_tags" | awk -v p="$1" 'index($0, p) == 1' | tail -n1; }

          latest=$(printf '%s\n' "$all_tags" | tail -n1)
          tag="${REQUESTED_TAG:-$latest}"
          if ! printf '%s' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$'; then
            echo "::error::'$tag' is not a <openresty-version>-<revision> tag"
            exit 1
          fi
          resty_version="${tag%-*}"
          series=$(printf '%s' "$resty_version" | cut -d. -f1,2)

          flag() { [ "$1" = "$2" ] && echo true || echo false; }
          {
            echo "upstream_tag=$tag"
            echo "resty_version=$resty_version"
            echo "series=$series"
            echo "is_latest=$(flag "$tag" "$latest")"
            echo "is_newest_revision=$(flag "$tag" "$(newest_with_prefix "$resty_version-")")"
            echo "is_newest_in_series=$(flag "$tag" "$(newest_with_prefix "$series.")")"
          } | tee -a "$GITHUB_OUTPUT"
          echo "newest upstream release: $latest"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: flavors
        env:
          UPSTREAM_TAG: ${{ steps.resolve.outputs.upstream_tag }}
          REQUESTED_FLAVORS: ${{ inputs.flavors }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # Every Docker Hub tag "<release>-<flavor>" with its linux platforms.
          # Upstream also publishes per-arch tags ("<release>-alpine-arm64"):
          # a single-platform tag whose last word is its own architecture is one
          # of those, not a flavor. Windows tags have no linux platform.
          url="https://hub.docker.com/v2/namespaces/${BASE_IMAGE%%/*}/repositories/${BASE_IMAGE#*/}/tags?page_size=100&name=${UPSTREAM_TAG}-"
          candidates=""
          while [ -n "$url" ]; do
            page=$(curl -fsSL --retry 3 "$url")
            candidates+=$(jq -c --arg p "$UPSTREAM_TAG-" '
              .results[]
              | select(.name | startswith($p))
              | { flavor: (.name | ltrimstr($p)),
                  platforms: ([.images[]?
                               | select(.os == "linux" and .architecture != "unknown")
                               | "linux/\(.architecture)\(if (.variant // "") != "" then "/" + .variant else "" end)"]
                              | unique) }
              | select(.platforms | length > 0)
              | select((.platforms | length) > 1
                       or (.flavor | split("-") | last) != (.platforms[0] | split("/")[1]))
              | .platforms |= join(",")' <<< "$page")$'\n'
            url=$(jq -r '.next // ""' <<< "$page")
          done

          wanted=",${REQUESTED_FLAVORS// /},"
          selected=""
          while IFS= read -r row; do
            [ -n "$row" ] || continue
            flavor=$(jq -r .flavor <<< "$row")
            if [ "$wanted" != ",," ] && [[ "$wanted" != *",$flavor,"* ]]; then
              continue
            fi
            if [ "$GITHUB_EVENT_NAME" = "schedule" ] \
               && docker buildx imagetools inspect "$IMAGE:$UPSTREAM_TAG-$flavor" > /dev/null 2>&1; then
              echo "$IMAGE:$UPSTREAM_TAG-$flavor exists"
              continue
            fi
            echo "build $flavor ($(jq -r .platforms <<< "$row"))"
            selected+="$row"$'\n'
          done <<< "$candidates"

          if [ -z "$selected" ] && [ -z "$candidates" ]; then
            echo "::notice::no $BASE_IMAGE:$UPSTREAM_TAG-* images on Docker Hub yet; checked again on the next run"
          fi
          echo "matrix=$(printf '%s' "$selected" | jq -sc '{include: .}')" >> "$GITHUB_OUTPUT"
          echo "candidates=$(printf '%s' "$candidates" | jq -sc .)" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: fromJSON(needs.detect.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    name: build (${{ matrix.flavor }})
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      RESTY_VERSION: ${{ needs.detect.outputs.resty_version }}
      SERIES: ${{ needs.detect.outputs.series }}
      IS_LATEST: ${{ needs.detect.outputs.is_latest }}
      IS_NEWEST_REVISION: ${{ needs.detect.outputs.is_newest_revision }}
      IS_NEWEST_IN_SERIES: ${{ needs.detect.outputs.is_newest_in_series }}
      FLAVOR: ${{ matrix.flavor }}
      PLATFORMS: ${{ matrix.platforms }}
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for smoke test
        id: smoke-build
        run: |
          if [[ ",$PLATFORMS," != *",linux/amd64,"* ]]; then
            echo "::notice::$FLAVOR has no linux/amd64 image; smoke test skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docker buildx build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg OPENRESTY_TAG="$UPSTREAM_TAG-$FLAVOR" \
            --platform linux/amd64 \
            -f docker/Dockerfile \
            -t openresty-prometheus:smoke \
            --load .
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: steps.smoke-build.outputs.run == 'true'
        run: |
          set -euo pipefail
          docker run -d --name smoke-app busybox \
            sh -c 'mkdir -p /www && echo app-ok > /www/index.html && httpd -f -p 8080 -h /www'
          docker run -d --name smoke-nginx --network container:smoke-app openresty-prometheus:smoke
          probe() { docker run --rm --network container:smoke-app curlimages/curl -sS --retry 10 --retry-connrefused --retry-delay 1 -m 15 "$@"; }

          docker exec smoke-nginx nginx -t

          # inbound
          [ "$(probe http://127.0.0.1/)" = "app-ok" ]
          # outbound, plain HTTP and CONNECT
          [ "$(probe -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 http://example.com/)" = "200" ]
          [ "$(probe -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 https://example.com/)" = "200" ]
          [ "$(probe http://127.0.0.1:9145/healthz)" = "ok" ]

          metrics=$(probe http://127.0.0.1:9145/metrics)
          echo "$metrics" | grep -E '^nginx_http_requests_total'
          echo "$metrics" | grep -q 'mode="0"'
          echo "$metrics" | grep -q 'method="CONNECT".*mode="1"'
          echo "$metrics" | grep -qx 'nginx_metric_errors_total 0'

      - name: Smoke test https interception
        if: steps.smoke-build.outputs.run == 'true'
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/intercept-ca"
          mkdir -p "$ca"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout "$ca/ca.key" -out "$ca/ca.crt" -subj "/CN=smoke-intercept-ca"
          # the CA is read by nginx workers, which don't run as root
          chmod 644 "$ca/ca.key"
          docker run -d --name smoke-intercept -e INTERCEPT_TLS=on \
            -v "$ca/ca.crt:/etc/nginx/intercept/ca.crt:ro" \
            -v "$ca/ca.key:/etc/nginx/intercept/ca.key:ro" \
            openresty-prometheus:smoke
          probe() { docker run --rm --network container:smoke-intercept -v "$ca/ca.crt:/ca.crt:ro" curlimages/curl -sS --retry 10 --retry-connrefused --retry-delay 1 -m 15 "$@"; }

          [ "$(probe --cacert /ca.crt -o /dev/null -w '%{http_code}' -x http://127.0.0.1:3128 https://example.com/)" = "200" ]

          metrics=$(probe http://127.0.0.1:9145/metrics)
          echo "$metrics" | grep 'host="example.com"'
          echo "$metrics" | grep -q 'method="GET",route="/",status="200",host="example.com",mode="1"'
          if echo "$metrics" | grep -q 'method="CONNECT"'; then
            echo "::error::intercepted call was also recorded as a CONNECT"
            exit 1
          fi

      - name: Smoke test logs
        if: always() && steps.smoke-build.outputs.run == 'true'
        run: |
          fatal=0
          for c in smoke-nginx smoke-intercept; do
            docker logs "$c" > /dev/null 2>&1 || continue
            echo "::group::$c"
            docker logs "$c" 2>&1 | tail -n 100
            echo "::endgroup::"
            if docker logs "$c" 2>&1 | grep -E '\[(emerg|alert|crit)\]|runtime error|entry thread aborted'; then
              echo "::error::$c logged fatal or Lua runtime errors"
              fatal=1
            fi
          done
          exit "$fatal"

      - name: Build and push
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          # docker-openresty's tag scheme, per flavor
          tags=("$UPSTREAM_TAG-$FLAVOR")
          [ "$IS_NEWEST_REVISION" = "true" ] && tags+=("$RESTY_VERSION-$FLAVOR")
          [ "$IS_NEWEST_IN_SERIES" = "true" ] && tags+=("$SERIES-$FLAVOR")
          [ "$IS_LATEST" = "true" ] && tags+=("$FLAVOR")
          [ "$IS_LATEST" = "true" ] && [ "$FLAVOR" = "$LATEST_FLAVOR" ] && tags+=("latest")

          tag_args=()
          for t in "${tags[@]}"; do tag_args+=(-t "$IMAGE:$t"); done

          docker buildx build \
            --build-arg BASE_IMAGE="$BASE_IMAGE" \
            --build-arg OPENRESTY_TAG="$UPSTREAM_TAG-$FLAVOR" \
            --platform "$PLATFORMS" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.revision="$GIT_SHA" \
            --label org.opencontainers.image.version="$UPSTREAM_TAG-$FLAVOR" \
            --label org.opencontainers.image.base.name="docker.io/$BASE_IMAGE:$UPSTREAM_TAG-$FLAVOR" \
            -f docker/Dockerfile \
            "${tag_args[@]}" \
            --push .

          {
            echo "### $FLAVOR"
            echo "base \`$BASE_IMAGE:$UPSTREAM_TAG-$FLAVOR\` · \`$PLATFORMS\` · commit \`${GIT_SHA::7}\`"
            echo
            printf -- '- `%s`\n' "${tags[@]/#/$IMAGE:}"
          } >> "$GITHUB_STEP_SUMMARY"

  catalog:
    needs: [detect, build]
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.detect.outputs.is_latest == 'true'
      && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      UPSTREAM_TAG: ${{ needs.detect.outputs.upstream_tag }}
      RESTY_VERSION: ${{ needs.detect.outputs.resty_version }}
      SERIES: ${{ needs.detect.outputs.series }}
      CANDIDATES: ${{ needs.detect.outputs.candidates }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write docs/images.md
        id: write
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"

          rows="" pins=""
          while IFS=$'\t' read -r flavor platforms; do
            [ -n "$flavor" ] || continue
            digest=$(docker buildx imagetools inspect "$IMAGE:$UPSTREAM_TAG-$flavor" \
                       --format '{{json .Manifest}}' 2> /dev/null | jq -r .digest) || continue
            tags="\`$UPSTREAM_TAG-$flavor\` \`$RESTY_VERSION-$flavor\` \`$SERIES-$flavor\` \`$flavor\`"
            [ "$flavor" = "$LATEST_FLAVOR" ] && tags+=" \`latest\`"
            rows+="| $flavor | $tags | ${platforms//,/, } |"$'\n'
            pins+="docker pull $IMAGE@$digest  # $UPSTREAM_TAG-$flavor"$'\n'
          done < <(jq -r 'sort_by(.flavor)[] | [.flavor, .platforms] | @tsv' <<< "$CANDIDATES")

          if [ -z "$rows" ]; then
            echo "::notice::no $UPSTREAM_TAG image in $IMAGE yet; docs/images.md left as is"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cat > docs/images.md <<EOF
          # Images

          <!-- Generated by .github/workflows/openresty-image.yml. Edits are overwritten. -->

          Newest release: **\`$UPSTREAM_TAG\`** (OpenResty $RESTY_VERSION). What each
          tag means is in the [README](../README.md#images--versioning).

          \`\`\`bash
          docker pull $IMAGE:latest
          docker pull $IMAGE:$UPSTREAM_TAG-$LATEST_FLAVOR
          \`\`\`

          | Flavor | Tags | Platforms |
          |---|---|---|
          $rows
          Pinned by digest, for production:

          \`\`\`bash
          $pins\`\`\`

          Older releases stay pullable under their \`<release>-<flavor>\` tags.
          EOF

          if git diff --quiet -- docs/images.md && git ls-files --error-unmatch docs/images.md > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit docs/images.md
        if: steps.write.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images.md
          git commit -m "docs: images for $UPSTREAM_TAG"
          for _ in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
