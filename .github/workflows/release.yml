name: Release

# Project releases are decoupled from image tags. Image tags mirror
# docker-openresty's (<openresty-tag>-<flavor> and friends); a GitHub Release
# marks a milestone of THIS project's capabilities.
#
# Cut one: move CHANGELOG.md's "Unreleased" entries under a new "## vX.Y.Z — date"
# heading, commit, then  git tag vX.Y.Z && git push origin vX.Y.Z
# The release notes are that section (.github/scripts/release-notes.sh); the
# run fails if the section is missing. Re-run it (or re-push the tag) to
# refresh the notes of an existing release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag whose release notes to (re)write, e.g. v1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          # notes = the tag's section of CHANGELOG.md; fails if there is none
          sh .github/scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --title "$TAG" --verify-tag --notes-file "$RUNNER_TEMP/notes.md"
          fi
