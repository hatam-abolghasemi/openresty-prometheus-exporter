name: Release

# Project releases are decoupled from image tags. Image tags mirror
# docker-openresty's (<openresty-tag>-<flavor> and friends); a GitHub Release
# marks a milestone of THIS project's capabilities. Cut one by pushing a SemVer
# tag:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes-file - <<'NOTE'
          Images for every docker-openresty release and flavor are published
          continuously by the "OpenResty image" workflow, under the same tags
          as openresty/openresty:

              ghcr.io/hatam-abolghasemi/openresty-prometheus-exporter:<openresty-tag>-<flavor>

          Pin by digest (`@sha256:...`) in production for an immutable build.
          NOTE
